[project]
name = "whisplab"
version = "1.0.0"
description = "Frame-level multi-task Transformer for automatic guitar tablature transcription"
authors = [
    {name = "Maximilian Johannes Paul Voshchepynets",email = "max.developer10001@gmail.com"}
]
readme = "README.md"
license = "MIT"
keywords = [
    "automatic-music-transcription",
    "guitar-tablature",
    "transformer",
    "music-information-retrieval",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.11",
    "torchaudio>=2.11",
    "librosa>=0.10",
    "mido>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "pyguitarpro>=0.9",
    "torchcodec (>=0.11.0,<0.12.0)",
    "nnaudio (>=0.3.4,<0.4.0)",
]

[project.urls]
Repository = "https://github.com/MaximilianJPaul/whisplab"

[project.scripts]
whisplab-train = "whisplab.train:main"
whisplab-evaluate = "whisplab.evaluate:main"
whisplab-predict = "whisplab.predict:main"
whisplab-export-gp = "whisplab.export_gp:main"
whisplab-case-study = "whisplab.case_study:main"

[tool.poetry]
packages = [{include = "whisplab", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
